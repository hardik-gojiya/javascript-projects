    <style>
      body {
        margin: 0;
        font-family: Arial, sans-serif;
        display: flex;
        justify-content: center;
        align-items: center;
        min-height: 100vh;
        background: #f3f4f6;
      }

      .carousel {
        width: 320px;
        height: 200px;
        overflow: hidden;
        border: 4px solid #555;
        border-radius: 12px;
        box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
        background: #fff;
        position: relative;
        padding: 10px;
        margin: 20px;
      }

      .carousel-track {
        display: flex;
        gap: 10px;
        width: max-content;
      }

      .carousel-track img {
        width: 320px;
        height: 200px;
        flex-shrink: 0;
        border-radius: 8px;
        object-fit: cover;
      }
    </style>

    <script>
      const track = document.querySelector(".carousel-track");

      const images = Array.from(track.children);
      images.forEach((img) => {
        const clone = img.cloneNode(true);
        track.appendChild(clone);
      });

      let scrollAmount = 0;
      const scrollSpeed = 1;

      function startScroll() {
        scrollAmount += scrollSpeed;
        if (scrollAmount >= track.scrollWidth / 2) {
          scrollAmount = 0; 
        }
        track.style.transform = `translateX(-${scrollAmount}px)`;
        requestAnimationFrame(startScroll);
      }

      startScroll();
    </script>
